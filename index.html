<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="Приймач подій перевищення порогу FPV-дронів по WebSocket">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FPV Детектор</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0a0a0a;color:#e8e8e8;
  font-family:-apple-system,Roboto,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;
  -webkit-user-select:none;user-select:none;overflow-x:hidden}
body{padding-bottom:env(safe-area-inset-bottom,0)}

/* Header */
header{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,#141414,#0f0f0f);
  border-bottom:1px solid #1e1e1e;padding:10px 14px;display:flex;align-items:center;gap:8px;
  padding-top:calc(10px + env(safe-area-inset-top,0))}
.logo{width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,#00e676,#00897b);
  display:flex;align-items:center;justify-content:center;font-size:20px}
.title-wrap{flex:1;min-width:0}
.title{font-size:16px;font-weight:700;color:#fff}
.status{font-size:11px;font-weight:500;display:flex;align-items:center;gap:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#666;
  flex-shrink:0;box-shadow:0 0 6px currentColor}
.status.connected::before{background:#00e676;color:#00e676;animation:pulse 2s infinite}
.status.connecting::before{background:#ffb300;color:#ffb300;animation:pulse 1s infinite}
.status.disconnected::before{background:#f44336;color:#f44336}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status.connected{color:#00e676}.status.connecting{color:#ffb300}.status.disconnected{color:#f44336}

.icon-btn{width:38px;height:38px;border-radius:10px;background:#1a1a1a;border:0;color:#ccc;
  font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:#2a2a2a}

/* Панель управления */
.control-panel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  padding:10px 12px;background:#0f0f0f;border-bottom:1px solid #1a1a1a}
.ctrl-btn{padding:12px 6px;border:0;border-radius:10px;font-size:13px;font-weight:700;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:transform .1s,opacity .15s;font-family:inherit;color:#fff}
.ctrl-btn .icon{font-size:18px}
.ctrl-btn:active{transform:scale(.95)}
.ctrl-btn:disabled{opacity:.35;cursor:not-allowed}
.btn-start{background:#2e7d32}
.btn-stop{background:#c62828}
.btn-pause{background:#f57c00}
.btn-clear{background:#424242}

/* Живий статус */
.live-status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:8px 12px;background:#0d0d0d;border-bottom:1px solid #1a1a1a;font-size:12px}
.live-status .item{background:#161616;border-radius:8px;padding:6px 8px;text-align:center;
  border:1px solid #222}
.live-status .val{font-size:15px;font-weight:700;color:#00e676;font-variant-numeric:tabular-nums}
.live-status .lbl{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:.5px}

/* Статистика */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 12px;
  background:#0f0f0f;border-bottom:1px solid #1a1a1a}
.stat{background:#161616;border-radius:10px;padding:8px 10px;text-align:center;border:1px solid #222}
.stat .num{font-size:20px;font-weight:700;color:#00e676;line-height:1}
.stat .lbl{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.stat.warn .num{color:#ffb300}.stat.alert .num{color:#ff5252}

/* Фільтри */
.filters{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;
  background:#0f0f0f;border-bottom:1px solid #1a1a1a;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{background:#1a1a1a;color:#999;border:1px solid #222;padding:6px 14px;
  border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;
  white-space:nowrap;flex-shrink:0;transition:all .15s}
.chip.active{background:#00e676;color:#000;border-color:#00e676}
.chip:active{transform:scale(.95)}

/* Події */
.events{padding:10px}
.empty-state{text-align:center;color:#444;padding:60px 20px;font-size:14px}
.empty-state .icon{font-size:48px;opacity:.3;margin-bottom:12px}
.event{background:linear-gradient(180deg,#181818,#141414);border-radius:12px;
  margin-bottom:8px;padding:12px 14px;border-left:4px solid #00e676;
  box-shadow:0 2px 8px rgba(0,0,0,.3);animation:slideIn .3s ease-out;
  position:relative;overflow:hidden}
.event.high{border-left-color:#ff1744;background:linear-gradient(180deg,#241212,#1a0e0e)}
.event.medium{border-left-color:#ff9100;background:linear-gradient(180deg,#241a10,#1a1209)}
.event.fresh::after{content:"";position:absolute;inset:0;border-radius:12px;
  box-shadow:0 0 0 2px #00e676;animation:flash 1.5s ease-out forwards}
@keyframes slideIn{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes flash{0%{box-shadow:0 0 0 2px #00e676}100%{box-shadow:0 0 0 0 transparent}}
.event-header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.freq{font-size:19px;font-weight:700;color:#00e676;font-variant-numeric:tabular-nums}
.event.high .freq{color:#ff5252}.event.medium .freq{color:#ffb300}
.time{font-size:11px;color:#666}
.power-row{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.power{font-size:16px;font-weight:600;color:#ffcc00;font-variant-numeric:tabular-nums}
.excess{font-size:11px;color:#888;background:#222;padding:2px 6px;border-radius:6px}
.event.high .excess{background:#3a1515;color:#ff8a8a}
.event.medium .excess{background:#3a2510;color:#ffc478}
.subrange{font-size:12px;color:#4fc3f7;font-weight:500;margin-top:6px}
.drone{font-size:12px;color:#aaa;margin-top:4px}
.meta{display:flex;justify-content:space-between;font-size:10px;color:#555;
  margin-top:8px;padding-top:6px;border-top:1px dashed #1f1f1f}

/* Toast */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-120px);
  background:#1e1e1e;color:#fff;padding:12px 20px;border-radius:24px;
  font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.6);
  transition:transform .3s cubic-bezier(.2,.8,.3,1.2);z-index:200;max-width:90vw;
  text-align:center;border:1px solid #333}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:#00e676;color:#00e676}
.toast.error{border-color:#f44336;color:#f44336}

/* Модальне вікно */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#161616;border-radius:16px;padding:20px;max-width:420px;width:100%;
  border:1px solid #2a2a2a;max-height:85vh;overflow-y:auto}
.modal h2{margin:0 0 16px;font-size:18px;color:#fff}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;color:#888;margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.5px}
.form-row input{width:100%;background:#0f0f0f;border:1px solid #2a2a2a;border-radius:10px;
  padding:12px;color:#e8e8e8;font-size:15px;font-family:inherit}
.form-row input:focus{outline:none;border-color:#00e676}
.switch-row{display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid #1f1f1f}
.switch-row:last-child{border-bottom:0}
.switch-row .lbl{font-size:14px;color:#ccc}
.switch-row .sub{font-size:11px;color:#666;margin-top:2px}
.switch{position:relative;width:48px;height:28px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:#333;border-radius:14px;cursor:pointer;
  transition:background .2s}
.switch .slider::before{content:"";position:absolute;width:22px;height:22px;
  left:3px;top:3px;background:white;border-radius:50%;transition:transform .2s}
.switch input:checked+.slider{background:#00e676}
.switch input:checked+.slider::before{transform:translateX(20px)}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px;border:0;border-radius:10px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit}
.btn-primary{background:#00e676;color:#000}
.btn-secondary{background:#2a2a2a;color:#ccc}
.btn:active{opacity:.8}
</style>
</head>
<body>

<header>
  <div class="logo">📡</div>
  <div class="title-wrap">
    <div class="title">FPV Детектор</div>
    <div id="connStatus" class="status disconnected">Відключено</div>
  </div>
  <button class="icon-btn" id="exportBtn" title="Експорт CSV">💾</button>
  <button class="icon-btn" id="settingsBtn" title="Налаштування">⚙️</button>
</header>

<!-- Панель управління -->
<div class="control-panel">
  <button class="ctrl-btn btn-start" id="startBtn" disabled>
    <span class="icon">▶️</span><span>Пуск</span>
  </button>
  <button class="ctrl-btn btn-pause" id="pauseBtn" disabled>
    <span class="icon">⏸️</span><span>Пауза</span>
  </button>
  <button class="ctrl-btn btn-stop" id="stopBtn" disabled>
    <span class="icon">⏹️</span><span>Стоп</span>
  </button>
  <button class="ctrl-btn btn-clear" id="clearBtn">
    <span class="icon">🗑️</span><span>Очистити</span>
  </button>
</div>

<!-- Живий статус -->
<div class="live-status">
  <div class="item"><div class="val" id="liveX">—</div><div class="lbl">Позиція X</div></div>
  <div class="item"><div class="val" id="livePass">0</div><div class="lbl">Прохід</div></div>
  <div class="item"><div class="val" id="liveState">—</div><div class="lbl">Стан</div></div>
</div>

<!-- Статистика -->
<div class="stats">
  <div class="stat alert"><div class="num" id="statHigh">0</div><div class="lbl">Критичні</div></div>
  <div class="stat warn"><div class="num" id="statMed">0</div><div class="lbl">Середні</div></div>
  <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Всього</div></div>
</div>

<!-- Фільтри -->
<div class="filters" id="filters">
  <button class="chip active" data-filter="all">Все</button>
</div>

<!-- Список подій -->
<div class="events" id="eventsList">
  <div class="empty-state">
    <div class="icon">📡</div>
    <div>Очікування подій...</div>
    <div style="font-size:12px;margin-top:8px;color:#333">
      Запустіть сканування на ПК
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Модальне вікно налаштувань -->
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h2>⚙️ Налаштування</h2>

    <div class="form-row">
      <label>Адреса сервера (IP комп'ютера)</label>
      <input type="text" id="inpHost" placeholder="192.168.1.100" inputmode="decimal" autocomplete="off">
    </div>

    <div class="form-row">
      <label>Порт WebSocket</label>
      <input type="number" id="inpPort" placeholder="8765" value="8765" min="1" max="65535">
    </div>

    <div class="switch-row">
      <div>
        <div class="lbl">🔔 Звук</div>
        <div class="sub">Сигнал при події</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="swSound" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="switch-row">
      <div>
        <div class="lbl">📳 Вібрація</div>
        <div class="sub">Дрижання телефону</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="swVibrate" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="switch-row">
      <div>
        <div class="lbl">🔔 Сповіщення</div>
        <div class="sub">Коли додаток згорнуто</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="swNotify">
        <span class="slider"></span>
      </label>
    </div>

    <div class="switch-row">
      <div>
        <div class="lbl">💡 Тримати екран</div>
        <div class="sub">Не вимикати дисплей</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="swWake">
        <span class="slider"></span>
      </label>
    </div>

    <div class="form-row" style="margin-top:14px">
      <label>Мінімальне перевищення (дБ)</label>
      <input type="number" id="inpMinExcess" value="0" min="0" max="60">
    </div>

    <div class="modal-btns">
      <button class="btn btn-secondary" id="cancelSettings">Скасувати</button>
      <button class="btn btn-primary" id="saveSettings">Зберегти</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   КОНФІГУРАЦІЯ
   ============================================================ */
const STORAGE_KEY = "fpv_settings";
const MAX_EVENTS = 300;
const RECONNECT_MIN = 1000;
const RECONNECT_MAX = 15000;
const DEDUP_WINDOW_MS = 5000;

const DEFAULTS = {
  host: location.hostname || "192.168.1.100",
  port: 8765,
  sound: true,
  vibrate: true,
  notify: false,
  wake: false,
  minExcess: 0,
};

let settings = loadSettings();
let ws = null;
let reconnectDelay = RECONNECT_MIN;
let reconnectTimer = null;
let events = [];
let filterSubrange = "all";
let audioCtx = null;
let wakeLock = null;
let currentFilter = "all";
let scanState = "idle";      // idle / running / paused / error
let currentX = null;
let currentPass = 0;

const $ = (id) => document.getElementById(id);
const els = {
  connStatus: $("connStatus"),
  eventsList: $("eventsList"),
  filters: $("filters"),
  statHigh: $("statHigh"),
  statMed: $("statMed"),
  statTotal: $("statTotal"),
  liveX: $("liveX"),
  livePass: $("livePass"),
  liveState: $("liveState"),
  toast: $("toast"),
  settingsModal: $("settingsModal"),
};

/* ============================================================
   НАЛАШТУВАННЯ
   ============================================================ */
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return Object.assign({}, DEFAULTS, s);
  } catch (e) {
    return Object.assign({}, DEFAULTS);
  }
}
function saveSettings() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) {}
}

/* ============================================================
   WEBSOCKET
   ============================================================ */
function wsURL() { return "ws://" + settings.host + ":" + settings.port; }

function connect() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  setStatus("connecting", "Підключення...");
  try {
    ws = new WebSocket(wsURL());
  } catch (e) {
    setStatus("disconnected", "Помилка URL");
    scheduleReconnect();
    return;
  }

  ws.onopen = () => {
    setStatus("connected", "Підключено · " + settings.host);
    reconnectDelay = RECONNECT_MIN;
    showToast("✅ Підключено до сканера", "success", 2000);
    updateControlButtons();
    if (settings.wake) acquireWakeLock();
  };

  ws.onmessage = (evt) => {
    let msg;
    try { msg = JSON.parse(evt.data); } catch (e) { return; }
    handleMessage(msg);
  };

  ws.onerror = () => {};

  ws.onclose = () => {
    setStatus("disconnected", "Відключено");
    releaseWakeLock();
    updateControlButtons();
    scheduleReconnect();
  };
}

function scheduleReconnect() {
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(() => {
    reconnectDelay = Math.min(reconnectDelay * 1.5, RECONNECT_MAX);
    connect();
  }, reconnectDelay);
}

function setStatus(cls, text) {
  els.connStatus.className = "status " + cls;
  els.connStatus.textContent = text;
}

/* ============================================================
   ОБРОБКА ПОВІДОМЛЕНЬ
   ============================================================ */
function handleMessage(msg) {
  switch (msg.type) {
    case "hello":
      console.log("Сервер:", msg.data);
      break;
    case "threshold_event":
      onThresholdEvent(msg.data);
      break;
    case "pass_completed":
      if (msg.data) {
        currentPass = msg.data.pass || currentPass;
        els.livePass.textContent = currentPass;
        showToast("Прохід " + currentPass + " завершено", "success", 1500);
      }
      break;
    case "scan_state":
      if (msg.data) {
        scanState = msg.data.state || scanState;
        updateScanStateLabel(scanState);
        if (msg.data.message) showToast(msg.data.message, "", 2000);
        updateControlButtons();
      }
      break;
    case "status":
      // оновлення живої позиції
      if (msg.data) {
        if (typeof msg.data.x === "number") {
          currentX = msg.data.x;
          els.liveX.textContent = msg.data.x.toFixed(1);
        }
        if (typeof msg.data.pass === "number") {
          currentPass = msg.data.pass;
          els.livePass.textContent = currentPass;
        }
      }
      break;
    case "pong":
      break;
  }
}

function updateScanStateLabel(state) {
  const labels = {
    "idle": "Очікування",
    "started": "Сканування",
    "running": "Сканування",
    "paused": "Пауза",
    "completed": "Завершено",
    "emergency": "Аварія",
    "error": "Помилка"
  };
  els.liveState.textContent = labels[state] || "—";
  els.liveState.style.color = 
    state === "running" || state === "started" ? "#00e676" :
    state === "paused" ? "#ffb300" :
    state === "error" || state === "emergency" ? "#ff5252" : "#888";
}

function onThresholdEvent(d) {
  if (!d || typeof d.frequency_mhz !== "number") return;
  const excess = (d.power_dbm || 0) - (d.threshold_dbm || 0);
  if (excess < settings.minExcess) return;

  const now = Date.now();
  const key = d.frequency_mhz.toFixed(2);
  const recent = events.find(e =>
    e.frequency_mhz.toFixed(2) === key && (now - e._ts) < DEDUP_WINDOW_MS
  );

  if (recent) {
    if (d.power_dbm > recent.power_dbm) {
      Object.assign(recent, d);
      recent._ts = now;
      draw();
      updateStats();
    }
    return;
  }

  d._ts = now;
  d._fresh = true;
  events.unshift(d);
  if (events.length > MAX_EVENTS) events.length = MAX_EVENTS;

  draw();
  updateStats();

  if (settings.sound) playBeep(d);
  if (settings.vibrate) vibrateByExcess(excess);
  if (settings.notify && document.visibilityState !== "visible") showPushNotification(d);

  showToast(
    d.frequency_mhz.toFixed(1) + " МГц · " + d.power_dbm.toFixed(1) + " дБм",
    "success",
    1800
  );

  // Прибираємо мітку "свіже" через 2 секунди
  setTimeout(() => { d._fresh = false; }, 2000);
}

/* ============================================================
   ВІДОБРАЖЕННЯ
   ============================================================ */
function draw() {
  const filtered = currentFilter === "all"
    ? events
    : events.filter(e => e.subrange === currentFilter);

  if (filtered.length === 0) {
    els.eventsList.innerHTML =
      '<div class="empty-state">' +
      '<div class="icon">📡</div>' +
      '<div>Очікування подій...</div>' +
      '</div>';
    return;
  }

  els.eventsList.innerHTML = "";
  filtered.forEach(d => {
    const excess = (d.power_dbm || 0) - (d.threshold_dbm || 0);
    let level = "low";
    if (excess > 20) level = "high";
    else if (excess > 10) level = "medium";

    const div = document.createElement("div");
    div.className = "event " + level + (d._fresh ? " fresh" : "");

    const t = d.time_str || (d.timestamp ? new Date(d.timestamp).toLocaleTimeString("uk-UA") : "");
    const x = typeof d.x_mm === "number" ? d.x_mm.toFixed(1) : "—";
    const thr = typeof d.threshold_dbm === "number" ? d.threshold_dbm.toFixed(1) : "—";
    const pass = d.pass_number || 1;

    div.innerHTML =
      '<div class="event-header">' +
        '<div class="freq">' + (d.frequency_mhz || 0).toFixed(3) + ' МГц</div>' +
        '<div class="time">' + t + '</div>' +
      '</div>' +
      '<div class="power-row">' +
        '<div class="power">' + (d.power_dbm || 0).toFixed(1) + ' дБм</div>' +
        '<div class="excess">+' + excess.toFixed(1) + ' дБ</div>' +
      '</div>' +
      '<div class="subrange">' + (d.subrange || "—") + '</div>' +
      '<div class="drone">🚁 ' + (d.drone_types || "тип не визначено") + '</div>' +
      '<div class="meta">' +
        '<span>X = ' + x + ' мм</span>' +
        '<span>Поріг ' + thr + ' дБм</span>' +
        '<span>Прохід ' + pass + '</span>' +
      '</div>';
    els.eventsList.appendChild(div);
  });
}

function updateStats() {
  const high = events.filter(e => (e.power_dbm - e.threshold_dbm) > 20).length;
  const med = events.filter(e => {
    const x = e.power_dbm - e.threshold_dbm;
    return x > 10 && x <= 20;
  }).length;
  els.statHigh.textContent = high;
  els.statMed.textContent = med;
  els.statTotal.textContent = events.length;
}

function updateFilterChips() {
  const subs = Array.from(new Set(events.map(e => e.subrange).filter(Boolean)));
  const existing = Array.from(els.filters.querySelectorAll(".chip")).map(c => c.dataset.filter);
  const needRebuild = subs.length !== existing.length - 1 || !subs.every(s => existing.indexOf(s) >= 0);

  if (needRebuild) {
    els.filters.innerHTML =
      '<button class="chip ' + (currentFilter === "all" ? "active" : "") + '" data-filter="all">Все</button>';
    subs.forEach(s => {
      const b = document.createElement("button");
      b.className = "chip" + (currentFilter === s ? " active" : "");
      b.dataset.filter = s;
      b.textContent = s;
      els.filters.appendChild(b);
    });
  }
}

/* ============================================================
   ЗВУК
   ============================================================ */
function playBeep(d) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();

    let baseFreq = 880;
    const sr = (d.subrange || "").toLowerCase();
    if (sr.indexOf("900") >= 0) baseFreq = 600;
    else if (sr.indexOf("1.2") >= 0) baseFreq = 700;
    else if (sr.indexOf("2.4") >= 0) baseFreq = 900;
    else if (sr.indexOf("5.8") >= 0) baseFreq = 1200;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
    osc.frequency.setValueAtTime(baseFreq * 1.4, audioCtx.currentTime + 0.09);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  } catch (e) {}
}

/* ============================================================
   ВІБРАЦІЯ
   ============================================================ */
function vibrateByExcess(excess) {
  if (!navigator.vibrate) return;
  if (excess > 20) navigator.vibrate([300, 100, 300, 100, 300]);
  else if (excess > 10) navigator.vibrate([200, 100, 200]);
  else navigator.vibrate(150);
}

/* ============================================================
   PUSH-СПОВІЩЕННЯ
   ============================================================ */
async function requestNotificationPermission() {
  if (!("Notification" in window)) return false;
  if (Notification.permission === "granted") return true;
  if (Notification.permission === "denied") return false;
  const p = await Notification.requestPermission();
  return p === "granted";
}

function showPushNotification(d) {
  if (Notification.permission !== "granted") return;
  const excess = (d.power_dbm || 0) - (d.threshold_dbm || 0);
  try {
    new Notification("🚨 FPV — " + (d.subrange || ""), {
      body:
        (d.frequency_mhz || 0).toFixed(2) + " МГц · " +
        (d.power_dbm || 0).toFixed(1) + " дБм (+" + excess.toFixed(1) + ")\n🚁 " +
        (d.drone_types || ""),
      icon: "icon-192.png",
      tag: "fpv-" + (d.frequency_mhz || 0).toFixed(1),
      requireInteraction: excess > 20,
      vibrate: [300, 100, 300],
      silent: false,
    });
  } catch (e) {}
}

/* ============================================================
   WAKE LOCK (не гасити екран)
   ============================================================ */
async function acquireWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) {}
}
function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}

/* ============================================================
   КЕРУВАННЯ СКАНУВАННЯМ
   ============================================================ */
function sendCommand(type, data) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    showToast("❌ Немає підключення", "error", 1500);
    return false;
  }
  const msg = { type: type };
  if (data) msg.data = data;
  ws.send(JSON.stringify(msg));
  return true;
}

function updateControlButtons() {
  const connected = ws && ws.readyState === WebSocket.OPEN;
  const running = scanState === "running" || scanState === "started";
  const paused = scanState === "paused";

  $("startBtn").disabled = !connected || running || paused;
  $("pauseBtn").disabled = !connected || (!running && !paused);
  $("stopBtn").disabled = !connected || (scanState === "idle" || scanState === "completed");
  $("clearBtn").disabled = events.length === 0;

  $("pauseBtn").querySelector(".icon").textContent = paused ? "▶️" : "⏸️";
  $("pauseBtn").querySelector("span:last-child").textContent = paused ? "Далі" : "Пауза";
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function showToast(text, type, ms) {
  type = type || "";
  ms = ms || 2000;
  els.toast.textContent = text;
  els.toast.className = "toast " + type + " show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove("show"), ms);
}

/* ============================================================
   ЕКСПОРТ CSV
   ============================================================ */
function exportCSV() {
  if (events.length === 0) {
    showToast("❌ Немає подій", "error", 1500);
    return;
  }

  const header = "Час,Частота МГц,Рівень дБм,Поріг дБм,Перевищення дБ,X мм,Піддіапазон,Тип дрона\n";
  const rows = events.map(e => [
    e.time_str || "",
    e.frequency_mhz.toFixed(3),
    e.power_dbm.toFixed(1),
    e.threshold_dbm.toFixed(1),
    (e.power_dbm - e.threshold_dbm).toFixed(1),
    e.x_mm.toFixed(1),
    (e.subrange || "").replace(/,/g, ";"),
    (e.drone_types || "").replace(/,/g, ";")
  ].join(",")).join("\n");

  const blob = new Blob(["\uFEFF" + header + rows], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "fpv_podii_" + new Date().toISOString().slice(0, 19).replace(/:/g, "-") + ".csv";
  a.click();
  URL.revokeObjectURL(url);
  showToast("💾 Файл збережено", "success", 2000);
}

/* ============================================================
   НАЛАШТУВАННЯ (UI)
   ============================================================ */
function openSettings() {
  $("inpHost").value = settings.host;
  $("inpPort").value = settings.port;
  $("swSound").checked = settings.sound;
  $("swVibrate").checked = settings.vibrate;
  $("swNotify").checked = settings.notify;
  $("swWake").checked = settings.wake;
  $("inpMinExcess").value = settings.minExcess;
  els.settingsModal.classList.add("show");
}
function closeSettings() {
  els.settingsModal.classList.remove("show");
}

async function saveSettingsFromUI() {
  const newHost = $("inpHost").value.trim();
  const newPort = parseInt($("inpPort").value, 10) || 8765;
  const wantNotify = $("swNotify").checked;

  if (!newHost) {
    showToast("❌ Введіть IP-адресу", "error", 2500);
    return;
  }

  if (wantNotify) {
    const ok = await requestNotificationPermission();
    if (!ok) {
      showToast("❌ Сповіщення заборонені", "error", 2500);
      $("swNotify").checked = false;
    }
  }

  settings.host = newHost;
  settings.port = newPort;
  settings.sound = $("swSound").checked;
  settings.vibrate = $("swVibrate").checked;
  settings.notify = $("swNotify").checked;
  settings.wake = $("swWake").checked;
  settings.minExcess = parseFloat($("inpMinExcess").value) || 0;
  saveSettings();
  closeSettings();

  if (settings.wake) acquireWakeLock(); else releaseWakeLock();

  if (ws) {
    try { ws.close(); } catch (e) {}
    ws = null;
  }
  showToast("✅ Збережено", "success");
  setTimeout(connect, 300);
}

/* ============================================================
   ОБРОБНИКИ ПОДІЙ
   ============================================================ */
// Кнопки керування
$("startBtn").onclick = () => {
  if (sendCommand("start_scan")) {
    showToast("▶️ Запуск сканування...", "success", 2000);
  }
};
$("stopBtn").onclick = () => {
  if (sendCommand("stop_scan")) {
    showToast("⏹️ Зупинка...", "", 2000);
  }
};
$("pauseBtn").onclick = () => {
  const paused = scanState === "paused";
  if (sendCommand(paused ? "resume_scan" : "pause_scan")) {
    showToast(paused ? "▶️ Продовження" : "⏸️ Пауза", "", 2000);
  }
};
$("clearBtn").onclick = () => {
  if (events.length === 0) return;
  if (confirm("Очистити всі події?")) {
    events = [];
    draw();
    updateStats();
    updateControlButtons();
    showToast("🗑️ Очищено", "success", 1500);
  }
};

// Фільтр
els.filters.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  els.filters.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  currentFilter = chip.dataset.filter;
  draw();
});

// Налаштування
$("settingsBtn").onclick = openSettings;
$("cancelSettings").onclick = closeSettings;
$("saveSettings").onclick = saveSettingsFromUI;
els.settingsModal.onclick = (e) => { if (e.target === els.settingsModal) closeSettings(); };

// Експорт
$("exportBtn").onclick = exportCSV;

// Розблокувати аудіо
document.body.addEventListener("click", () => {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}, { capture: true });

// Повернення на сторінку
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    if (!ws || ws.readyState === WebSocket.CLOSED) connect();
    if (settings.wake) acquireWakeLock();
  } else {
    releaseWakeLock();
  }
});

// Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

/* ============================================================
   ЗАПУСК
   ============================================================ */
draw();
updateStats();
updateControlButtons();
connect();

if (!settings.host || settings.host === "localhost") {
  setTimeout(openSettings, 600);
}

// Оновлювати фільтри при зміні подій
setInterval(updateFilterChips, 1000);

console.log("FPV Детектор готовий");
</script>
</body>
</html>

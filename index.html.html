<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="FPV Drone Detector — приёмник событий по WebSocket">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FPV Detector</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0a0a0a;color:#e8e8e8;
  font-family:-apple-system,Roboto,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;
  -webkit-user-select:none;user-select:none;overflow-x:hidden}
body{padding-bottom:env(safe-area-inset-bottom,0)}
header{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,#141414,#0f0f0f);
  border-bottom:1px solid #1e1e1e;padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top,0));
  display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,#00e676,#00897b);
  display:flex;align-items:center;justify-content:center;font-size:20px}
.title-wrap{flex:1;min-width:0}
.title{font-size:16px;font-weight:700;color:#fff}
.status{font-size:11px;font-weight:500;display:flex;align-items:center;gap:5px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#666}
.status.connected::before{background:#00e676;animation:pulse 2s infinite}
.status.connecting::before{background:#ffb300;animation:pulse 1s infinite}
.status.disconnected::before{background:#f44336}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status.connected{color:#00e676}.status.connecting{color:#ffb300}.status.disconnected{color:#f44336}
.icon-btn{width:40px;height:40px;border-radius:10px;background:#1a1a1a;border:0;color:#ccc;
  font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:#2a2a2a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px;
  background:#0f0f0f;border-bottom:1px solid #1a1a1a}
.stat{background:#161616;border-radius:10px;padding:8px 10px;text-align:center;border:1px solid #222}
.stat .num{font-size:20px;font-weight:700;color:#00e676;line-height:1}
.stat .lbl{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.stat.warn .num{color:#ffb300}.stat.alert .num{color:#ff5252}
.events{padding:10px}
.empty-state{text-align:center;color:#444;padding:60px 20px;font-size:14px}
.empty-state .icon{font-size:48px;opacity:.3;margin-bottom:12px}
.event{background:linear-gradient(180deg,#181818,#141414);border-radius:12px;
  margin-bottom:8px;padding:12px 14px;border-left:4px solid #00e676;
  animation:slideIn .3s ease-out}
.event.high{border-left-color:#ff1744;background:linear-gradient(180deg,#241212,#1a0e0e)}
.event.medium{border-left-color:#ff9100;background:linear-gradient(180deg,#241a10,#1a1209)}
@keyframes slideIn{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
.event-header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.freq{font-size:19px;font-weight:700;color:#00e676}
.event.high .freq{color:#ff5252}.event.medium .freq{color:#ffb300}
.time{font-size:11px;color:#666}
.power-row{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.power{font-size:16px;font-weight:600;color:#ffcc00}
.excess{font-size:11px;color:#888;background:#222;padding:2px 6px;border-radius:6px}
.subrange{font-size:12px;color:#4fc3f7;font-weight:500;margin-top:6px}
.drone{font-size:12px;color:#aaa;margin-top:4px}
.meta{display:flex;justify-content:space-between;font-size:10px;color:#555;
  margin-top:8px;padding-top:6px;border-top:1px dashed #1f1f1f}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-120px);
  background:#1e1e1e;color:#fff;padding:12px 20px;border-radius:24px;
  font-size:13px;transition:transform .3s;z-index:200;border:1px solid #333}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:#00e676;color:#00e676}
.toast.error{border-color:#f44336;color:#f44336}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#161616;border-radius:16px;padding:20px;max-width:400px;width:100%;
  border:1px solid #2a2a2a;max-height:85vh;overflow-y:auto}
.modal h2{margin:0 0 16px;font-size:18px;color:#fff}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;color:#888;margin-bottom:6px}
.form-row input{width:100%;background:#0f0f0f;border:1px solid #2a2a2a;border-radius:10px;
  padding:12px;color:#e8e8e8;font-size:15px}
.form-row input:focus{outline:none;border-color:#00e676}
.switch-row{display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid #1f1f1f}
.switch{position:relative;width:48px;height:28px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:#333;border-radius:14px;cursor:pointer}
.switch .slider::before{content:"";position:absolute;width:22px;height:22px;
  left:3px;top:3px;background:white;border-radius:50%;transition:transform .2s}
.switch input:checked+.slider{background:#00e676}
.switch input:checked+.slider::before{transform:translateX(20px)}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px;border:0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.btn-primary{background:#00e676;color:#000}
.btn-secondary{background:#2a2a2a;color:#ccc}
</style>
</head>
<body>

<header>
  <div class="logo">📡</div>
  <div class="title-wrap">
    <div class="title">FPV Detector</div>
    <div id="connStatus" class="status disconnected">Отключено</div>
  </div>
  <button class="icon-btn" id="settingsBtn">⚙️</button>
</header>

<div class="stats">
  <div class="stat alert"><div class="num" id="statHigh">0</div><div class="lbl">Критич.</div></div>
  <div class="stat warn"><div class="num" id="statMed">0</div><div class="lbl">Средне</div></div>
  <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Всего</div></div>
</div>

<div class="events" id="eventsList">
  <div class="empty-state">
    <div class="icon">📡</div>
    <div>Ожидание событий...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h2>⚙️ Настройки</h2>
    <div class="form-row">
      <label>Адрес сервера (IP компьютера)</label>
      <input type="text" id="inpHost" placeholder="192.168.1.100" inputmode="decimal">
    </div>
    <div class="form-row">
      <label>Порт</label>
      <input type="number" id="inpPort" value="8765">
    </div>
    <div class="switch-row">
      <div><div class="lbl" style="color:#ccc;font-size:14px">🔔 Звук</div></div>
      <label class="switch"><input type="checkbox" id="swSound" checked><span class="slider"></span></label>
    </div>
    <div class="switch-row">
      <div><div class="lbl" style="color:#ccc;font-size:14px">📳 Вибрация</div></div>
      <label class="switch"><input type="checkbox" id="swVibrate" checked><span class="slider"></span></label>
    </div>
    <div class="switch-row">
      <div><div class="lbl" style="color:#ccc;font-size:14px">🔔 Уведомления</div></div>
      <label class="switch"><input type="checkbox" id="swNotify"><span class="slider"></span></label>
    </div>
    <div class="modal-btns">
      <button class="btn btn-secondary" id="cancelSettings">Отмена</button>
      <button class="btn btn-primary" id="saveSettings">Сохранить</button>
    </div>
  </div>
</div>

<script>
"use strict";
const STORAGE_KEY="fpv_settings";
const MAX_EVENTS=300;
const RECONNECT_MIN=1000;
const RECONNECT_MAX=15000;
const DEFAULTS={host:location.hostname||"192.168.1.100",port:8765,
  sound:true,vibrate:true,notify:false,minExcess:0};

let settings=loadSettings();
let ws=null,reconnectDelay=RECONNECT_MIN,reconnectTimer=null;
let events=[],filterSubrange="all",audioCtx=null;

const $=id=>document.getElementById(id);
const els={connStatus:$("connStatus"),eventsList:$("eventsList"),
  statHigh:$("statHigh"),statMed:$("statMed"),statTotal:$("statTotal"),
  toast:$("toast"),settingsModal:$("settingsModal")};

function loadSettings(){
  try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");return Object.assign({},DEFAULTS,s)}
  catch(e){return Object.assign({},DEFAULTS)}
}
function saveSettings(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(settings))}catch(e){}}
function wsURL(){return "ws://"+settings.host+":"+settings.port}

function connect(){
  if(ws&&(ws.readyState===WebSocket.OPEN||ws.readyState===WebSocket.CONNECTING))return;
  setStatus("connecting","Подключение к "+wsURL());
  try{ws=new WebSocket(wsURL())}catch(e){setStatus("disconnected","Ошибка URL");scheduleReconnect();return}
  ws.onopen=()=>{setStatus("connected","Подключено · "+settings.host);
    reconnectDelay=RECONNECT_MIN;showToast("✅ Подключено","success",2000)};
  ws.onmessage=evt=>{let m;try{m=JSON.parse(evt.data)}catch(e){return}handleMessage(m)};
  ws.onerror=()=>{};
  ws.onclose=()=>{setStatus("disconnected","Отключено");scheduleReconnect()};
}
function scheduleReconnect(){
  clearTimeout(reconnectTimer);
  reconnectTimer=setTimeout(()=>{reconnectDelay=Math.min(reconnectDelay*1.5,RECONNECT_MAX);connect()},reconnectDelay);
}
function setStatus(c,t){els.connStatus.className="status "+c;els.connStatus.textContent=t}

function handleMessage(msg){
  switch(msg.type){
    case"hello":console.log("Server:",msg.data);break;
    case"threshold_event":onThresholdEvent(msg.data);break;
    case"pass_completed":if(msg.data&&msg.data.pass)showToast("Проход "+msg.data.pass+" завершён","",1500);break;
    case"scan_state":if(msg.data&&msg.data.message)showToast(msg.data.message,"",2000);break;
  }
}
function onThresholdEvent(d){
  if(!d||typeof d.frequency_mhz!=="number")return;
  const excess=(d.power_dbm||0)-(d.threshold_dbm||0);
  if(excess<settings.minExcess)return;
  const now=Date.now(),key=d.frequency_mhz.toFixed(2);
  const recent=events.find(e=>e.frequency_mhz.toFixed(2)===key&&(now-e._ts)<5000);
  if(recent){if(d.power_dbm>recent.power_dbm){Object.assign(recent,d);recent._ts=now;renderEvents();updateStats()}return}
  d._ts=now;events.unshift(d);
  if(events.length>MAX_EVENTS)events.length=MAX_EVENTS;
  renderEvents();updateStats();
  if(settings.sound)playBeep(d);
  if(settings.vibrate)vibrateByExcess(excess);
  if(settings.notify&&document.visibilityState!=="visible")showPushNotification(d);
  showToast(d.frequency_mhz.toFixed(1)+" MHz · "+d.power_dbm.toFixed(1)+" dBm","success",1800);
}

function renderEvents(){
  const filtered=filterSubrange==="all"?events:events.filter(e=>e.subrange===filterSubrange);
  if(filtered.length===0){els.eventsList.innerHTML='<div class="empty-state"><div class="icon">📡</div><div>Ожидание событий...</div></div>';return}
  const frag=document.createDocumentFragment();
  filtered.forEach(e=>frag.appendChild(renderEvent(e)));
  els.eventsList.innerHTML="";els.eventsList.appendChild(frag);
}
function renderEvent(d){
  const excess=(d.power_dbm||0)-(d.threshold_dbm||0);
  let level="low";if(excess>20)level="high";else if(excess>10)level="medium";
  const el=document.createElement("div");el.className="event "+level;
  const t=d.time_str||(d.timestamp?new Date(d.timestamp).toLocaleTimeString("ru-RU"):"");
  el.innerHTML='<div class="event-header"><div class="freq">'+(d.frequency_mhz||0).toFixed(3)+' MHz</div>'+
    '<div class="time">'+t+'</div></div>'+
    '<div class="power-row"><div class="power">'+(d.power_dbm||0).toFixed(1)+' dBm</div>'+
    '<div class="excess">+'+excess.toFixed(1)+' дБ</div></div>'+
    '<div class="subrange">'+(d.subrange||"—")+'</div>'+
    '<div class="drone">🚁 '+(d.drone_types||"—")+'</div>'+
    '<div class="meta"><span>X='+(d.x_mm||0).toFixed(1)+' мм</span>'+
    '<span>Порог '+(d.threshold_dbm||0).toFixed(1)+' dBm</span>'+
    '<span>Проход '+(d.pass_number||1)+'</span></div>';
  return el;
}
function updateStats(){
  const high=events.filter(e=>(e.power_dbm-e.threshold_dbm)>20).length;
  const med=events.filter(e=>{const x=e.power_dbm-e.threshold_dbm;return x>10&&x<=20}).length;
  els.statHigh.textContent=high;els.statMed.textContent=med;els.statTotal.textContent=events.length;
}
function playBeep(d){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    let bf=880;const sr=(d.subrange||"").toLowerCase();
    if(sr.indexOf("900")>=0)bf=600;else if(sr.indexOf("2.4")>=0)bf=900;else if(sr.indexOf("5.8")>=0)bf=1200;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type="square";o.frequency.setValueAtTime(bf,audioCtx.currentTime);
    o.frequency.setValueAtTime(bf*1.4,audioCtx.currentTime+0.09);
    g.gain.setValueAtTime(0.15,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.25);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.25);
  }catch(e){}
}
function vibrateByExcess(excess){
  if(!navigator.vibrate)return;
  if(excess>20)navigator.vibrate([300,100,300,100,300]);
  else if(excess>10)navigator.vibrate([200,100,200]);
  else navigator.vibrate(150);
}
async function requestNotificationPermission(){
  if(!("Notification"in window))return false;
  if(Notification.permission==="granted")return true;
  if(Notification.permission==="denied")return false;
  const p=await Notification.requestPermission();return p==="granted";
}
function showPushNotification(d){
  if(Notification.permission!=="granted")return;
  try{new Notification("🚨 FPV Alert — "+(d.subrange||""),{
    body:(d.frequency_mhz||0).toFixed(2)+" MHz · "+(d.power_dbm||0).toFixed(1)+" dBm",
    icon:"icon-192.png",tag:"fpv-"+(d.frequency_mhz||0).toFixed(1)});
  }catch(e){}
}
let toastTimer=null;
function showToast(text,type,ms){
  type=type||"";ms=ms||2000;
  els.toast.textContent=text;els.toast.className="toast "+type+" show";
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>els.toast.classList.remove("show"),ms);
}
function openSettings(){
  $("inpHost").value=settings.host;$("inpPort").value=settings.port;
  $("swSound").checked=settings.sound;$("swVibrate").checked=settings.vibrate;
  $("swNotify").checked=settings.notify;els.settingsModal.classList.add("show");
}
function closeSettings(){els.settingsModal.classList.remove("show")}
async function saveSettingsFromUI(){
  const newHost=$("inpHost").value.trim();
  const newPort=parseInt($("inpPort").value,10)||8765;
  if(!newHost){showToast("❌ Введите IP","error",2500);return}
  if($("swNotify").checked){const ok=await requestNotificationPermission();if(!ok)$("swNotify").checked=false}
  settings.host=newHost;settings.port=newPort;
  settings.sound=$("swSound").checked;settings.vibrate=$("swVibrate").checked;
  settings.notify=$("swNotify").checked;
  saveSettings();closeSettings();
  if(ws){try{ws.close()}catch(e){}ws=null}
  showToast("✅ Сохранено","success");setTimeout(connect,300);
}
$("settingsBtn").addEventListener("click",openSettings);
$("cancelSettings").addEventListener("click",closeSettings);
$("saveSettings").addEventListener("click",saveSettingsFromUI);
els.settingsModal.addEventListener("click",e=>{if(e.target===els.settingsModal)closeSettings()});
document.body.addEventListener("click",()=>{
  try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume()}catch(e){}
},{capture:true});
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){if(!ws||ws.readyState===WebSocket.CLOSED)connect()}
});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
renderEvents();updateStats();connect();
if(!settings.host||settings.host==="localhost")setTimeout(openSettings,600);
console.log("FPV Detector ready");
</script>
</body>
</html>
